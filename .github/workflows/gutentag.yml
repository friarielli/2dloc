# Formats the LaTeX sources (tools/texformat.py), then tags every new unit and records
# removed tags (tools/gutentag.py). Formatting never changes the tagged units.
name: gutentag

on:
  push:
    branches: [main]
    paths: ['sections/**', 'tools/*.py', '.github/workflows/gutentag.yml']
  pull_request:
    paths: ['sections/**', 'tools/*.py', '.github/workflows/gutentag.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/texformat.py
      - run: python3 tools/gutentag.py

  tag:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: gutentag-main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 tools/texformat.py --write
      - run: python3 tools/gutentag.py --write
      - name: Push the formatting and the new tags
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898248+github-actions[bot]@users.noreply.github.com'
          git commit -qam 'Format sources and assign gutentags'
          if ! git push origin HEAD:main; then
            git fetch -q origin main
            # Fail unless the push lost a race against a newer push, whose queued run tags it.
            test "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD~1)"
            echo '::warning::main moved during tagging; the queued run handles it'
          fi
